<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>how i met your LLM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Kalam:wght@400;700&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <main id="theater">
        <div id="screen-wrap">
          <div id="screen">
            <div id="viewport"></div>

            <div id="loc-label" class="hidden"></div>

            <div id="year" class="hidden">2030</div>

            <div id="insert" class="hidden" aria-live="polite"></div>

            <div id="caption" class="hidden">
              <span id="caption-name"></span>
              <span id="caption-text"></span>
            </div>

            <div id="title-card" class="hidden">
              <div class="title-photo" aria-hidden="true"></div>
              <div class="show-title" aria-label="how i met your llm"><span>how i met</span><span>your</span><span class="last">llm</span></div>
            </div>

            <div id="credit" class="hidden"></div>

            <div id="closing-credits" class="hidden" role="region" aria-label="Closing credits"></div>

            <div id="sound-hint" class="hidden">click for sound</div>

            <div id="standby" class="hidden">
              <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div class="standby-box">
                <div class="standby-title">PLEASE STAND BY</div>
                <div id="standby-msg">The writers are at MacLaren's.</div>
              </div>
            </div>

          </div>
        </div>

        <div id="transport">
          <button id="btn-pause" title="Pause (space)">❚❚</button>
          <button id="btn-back-ep" title="Previous episode (shift+←)">⏮ episode</button>
          <button id="btn-back" title="Previous scene (←)">⏮ scene</button>
          <button id="btn-skip" title="Skip scene (→)">⏭ scene</button>
          <button id="btn-skip-ep" title="Skip episode (shift+→)">⏭ episode</button>
          <div class="spacer"></div>
          <label class="vol">vol <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" /></label>
          <button id="btn-full" title="Fullscreen">⛶</button>
        </div>
      </main>

      <aside id="panel">
        <header>
          <div class="logo small">how i met your <span class="llm">llm</span></div>
          <div class="tagline">an endless sitcom, written by language models</div>
        </header>

        <section id="now">
          <h3>now playing</h3>
          <div id="now-code">—</div>
          <div id="now-title">—</div>
          <div id="now-logline"></div>
          <div id="now-meta"></div>
        </section>

        <section id="episodes">
          <h3>episodes <span class="sub" id="episodes-count"></span></h3>
          <ol id="episode-list"></ol>
        </section>

        <section id="transcript-wrap">
          <h3>transcript</h3>
          <ol id="transcript"></ol>
        </section>

        <section id="settings">
          <h3>picture &amp; sound</h3>
          <label class="check"><input id="opt-style" type="checkbox" checked /> stylized picture</label>
          <label class="slider">resolution <input id="opt-res" type="range" min="160" max="540" step="10" value="270" /><span id="opt-res-v">270p</span></label>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
