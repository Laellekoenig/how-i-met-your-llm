<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>how i met your LLM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Kalam:wght@400;700&family=Roboto+Condensed:wght@400;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <main id="theater">
        <div id="screen-wrap">
          <div id="screen">
            <div id="viewport"></div>

            <div id="graphics" aria-live="polite"></div>

            <div id="osd" class="hidden"></div>

            <div id="loc-label" class="hidden"></div>

            <div id="year" class="hidden">2030</div>

            <div id="insert" class="hidden" aria-live="polite"></div>

            <div id="caption" class="hidden">
              <span id="caption-name"></span>
              <span id="caption-text"></span>
            </div>

            <div id="title-card" class="hidden">
              <div class="title-photo" aria-hidden="true"></div>
              <div class="show-title" aria-label="how i met your llm"><span>how i met</span><span>your</span><span class="last">llm</span></div>
            </div>

            <div id="credit" class="hidden"></div>

            <div id="closing-credits" class="hidden" role="region" aria-label="Closing credits"></div>

            <div id="sound-hint" class="hidden">click for sound</div>

            <div id="standby" class="hidden">
              <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div class="standby-box">
                <div class="standby-title">PLEASE STAND BY</div>
                <div id="standby-msg">The writers are at MacLaren's.</div>
              </div>
            </div>

            <div id="guide" class="hidden"></div>

          </div>
        </div>

        <div id="transport">
          <svg class="icons" aria-hidden="true">
            <symbol id="i-prev" viewBox="0 0 16 16"><path d="M3 3h2v10H3zM13 3v10L6 8z" /></symbol>
            <symbol id="i-back" viewBox="0 0 16 16"><path d="M8 3v10L2 8zM15 3v10L9 8z" /></symbol>
            <symbol id="i-pause" viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z" /></symbol>
            <symbol id="i-play" viewBox="0 0 16 16"><path d="M4 2.5v11L13 8z" /></symbol>
            <symbol id="i-skip" viewBox="0 0 16 16"><path d="M1 3v10l6-5zM8 3v10l6-5z" /></symbol>
            <symbol id="i-next" viewBox="0 0 16 16"><path d="M3 3v10l7-5zM11 3h2v10h-2z" /></symbol>
            <symbol id="i-full" viewBox="0 0 16 16"><path d="M2 2h5v2H4v3H2zM9 2h5v5h-2V4H9zM2 9h2v3h3v2H2zM12 9h2v5H9v-2h3z" /></symbol>
          </svg>
          <button id="btn-back-ep" title="Previous episode (shift+←)" aria-label="Previous episode"><svg><use href="#i-prev" /></svg></button>
          <button id="btn-back" title="Previous scene (←)" aria-label="Previous scene"><svg><use href="#i-back" /></svg></button>
          <button id="btn-pause" title="Pause (space)" aria-label="Pause"><svg class="pause"><use href="#i-pause" /></svg><svg class="play"><use href="#i-play" /></svg></button>
          <button id="btn-skip" title="Next scene (→)" aria-label="Next scene"><svg><use href="#i-skip" /></svg></button>
          <button id="btn-skip-ep" title="Next episode (shift+→)" aria-label="Next episode"><svg><use href="#i-next" /></svg></button>
          <button id="btn-guide" class="text" title="TV guide (esc)">guide</button>
          <div class="spacer"></div>
          <label class="opt" title="Stylized picture"><input id="opt-style" type="checkbox" checked /> stylized</label>
          <label class="opt" title="Picture resolution"><input id="opt-res" type="range" min="160" max="540" step="10" value="270" /><span id="opt-res-v">270p</span></label>
          <label class="opt" title="Volume">vol <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" /></label>
          <button id="btn-full" title="Fullscreen (f)" aria-label="Fullscreen"><svg><use href="#i-full" /></svg></button>
        </div>
      </main>

      <aside id="panel">
        <section id="now">
          <div id="now-code">off the air</div>
          <div id="now-title"></div>
          <div id="now-meta"></div>
        </section>

        <ol id="transcript"></ol>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
